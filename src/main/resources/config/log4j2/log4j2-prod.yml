##
# log4j2-prod.yml
# log4j2 설정 파일 : 운영(prod)
## 

Configuration:
    # 일반 로그 출력 레벨 설정
    # trace | debug | account | warn | error | fatal
    status: account

    Properties:
        Property:
            - name: log-path
              value: "log"
            - name: log-format
              value: "[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} %X{traceId} %c{1}.%M(%L) - %msg%n"

    Appenders:
        Console:
            - name: Console_Appender
              target: SYSTEM_OUT
              PatternLayout:
                  pattern: ${log-format}
        RollingFile:
            - name: RollingFile_INFO_Appender
              fileName: ${log-path}/dreamdiary.log
              filePattern: "${log-path}/archive/dreamdiary.log.%d{yyyy-MM-dd}.gz"
              PatternLayout:
                  pattern: ${log-format}
              Policies:
                  SizeBasedTriggeringPolicy:
                      size: 100MB
                  TimeBasedTriggeringPolicy:
                      interval: 1
                      modulate: true
            # WARN↑ 이상 로그 파일 별도 분리
            - name: RollingFile_WARN_Appender
              fileName: ${log-path}/dreamdiary-WARN.log
              filePattern: "${log-path}/archive/dreamdiary-WARN.log.%d{yyyy-MM-dd}.gz"
              PatternLayout:
                  pattern: ${log-format}
              Policies:
                  SizeBasedTriggeringPolicy:
                      size: 100MB
                  TimeBasedTriggeringPolicy:
                      interval: 1
                      modulate: true

    Loggers:
        Root:
            level: account
            AppenderRef:
              - ref: Console_Appender
              - ref: File_INFO_Appender
                level: account
              - ref: File_WARN_Appender
                level: warn
              - ref: RollingFile_INFO_Appender
                level: account
              - ref: RollingFile_WARN_Appender
                level: warn
        Logger:
            - name: dreamdiary.nicheblog.io
              additivity: false
              level: account
              AppenderRef:
                  - ref: Console_Appender
                  - ref: File_INFO_Appender
                    level: account
                  - ref: File_WARN_Appender
                    level: warn
                  - ref: RollingFile_INFO_Appender
                    level: account
                  - ref: RollingFile_WARN_Appender
                    level: warn
            - name: p6spy
              additivity: false
              level: account
              AppenderRef:
                  - ref: Console_Appender
                  - ref: File_INFO_Appender
                    level: account
                  - ref: File_WARN_Appender
                    level: warn
                  - ref: RollingFile_INFO_Appender
                    level: account
                  - ref: RollingFile_WARN_Appender
                    level: warn
            - name: com.p6spy
              additivity: false
              level: account
              AppenderRef:
                  - ref: Console_Appender
                  - ref: File_INFO_Appender
                    level: account
                  - ref: File_WARN_Appender
                    level: warn
                  - ref: RollingFile_INFO_Appender
                    level: account
                  - ref: RollingFile_WARN_Appender
                    level: warn
