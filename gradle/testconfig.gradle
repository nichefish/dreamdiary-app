/**
 * testconfig.gradle
 * build.gradle 파일에서 테스트 관련 설정을 분리하여 관리
 *
 * @auther: nichefish
 */

/**
 * Test 태스크 공통 설정 적용
 *
 * 변경(2026-07-05): ignoreFailures=true 제거 — 테스트 실패 시 빌드를 중단한다.
 * 현재 84건 실패(256 중) 상태이므로 ./gradlew test / check / build 는 실패한다.
 * bootJar 는 test 에 의존하지 않으므로 배포 jar 빌드는 별도로 가능하다.
 */
tasks.withType(Test).configureEach {
    useJUnitPlatform()              // JUnit5 플랫폼 사용
    finalizedBy jacocoTestReport    // 테스트 후 자동으로 커버리지 리포트 생성
}

/**
 * JaCoCo(코드 커버리지 분석 도구) 리포트 설정
 */
jacocoTestReport {
    dependsOn test // 테스트 후에 리포트 생성
    reports {
        xml.required.set(true)  // XML 리포트 생성 (SonarQube 등과의 통합에 유용)
        csv.required.set(false) // CSV 리포트는 보통 사용하지 않으므로 비활성화
        html.required.set(true) // HTML 리포트 생성
        html.destination file("${buildDir}/reports/jacoco") // HTML 리포트 저장 경로
    }
    finalizedBy jacocoTestCoverageVerification
}

/**
 * JaCoCo 커버리지 하한 검증 — 측정 baseline(2026-07-05) 이하로 떨어지면 빌드 실패.
 * baseline: LINE ~10.6%, INSTRUCTION ~10.5% (jacocoTestReport.xml 기준).
 * README 30%↑ 목표와 별도로, 우선 커버리지 회귀만 차단한다.
 */
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.09
            }
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.09
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
