chat.ai.prompt.rag.retry.guard-detail-label=거부 사유 코드: {0}\n
chat.ai.prompt.rag.retry.hint.person-stance-too-short=직전 답이 너무 짧았습니다. 근거 장면을 더 읽고 네 태도·마음을 충분히 길게 풀어 쓰세요.\n
chat.ai.prompt.rag.retry.hint.person-stance-scaffold-leak=직전 답에 내부 필드명·스캐폴드 문구가 새어 나왔습니다. 그런 메타 표현 없이 자연스러운 산문으로만 쓰세요.\n
chat.ai.prompt.rag.retry.hint.person-stance-generic-bucket=직전 답이 기록 근거 없이 조직·업무 일반론만 나열했습니다. SNAPSHOT의 실제 태그·근거 장면을 인용해 다시 쓰세요.\n
chat.ai.prompt.rag.retry.hint.person-meaning-hollow=직전 답은 기록 근거·해석이 비어 있었습니다. 태그·연결 맥락·책터·기록 유형 중 하나 이상을 인용하세요.\n
chat.ai.prompt.rag.retry.hint.language-guard=직전 답은 한국어 전용 규칙을 어겼습니다. 한국어만 쓰세요.\n
chat.ai.prompt.rag.retry.hint.empty-response=직전 답이 비어 있었습니다. SNAPSHOT만 근거로 다시 작성하세요.\n
chat.ai.prompt.rag.retry.hint.default=직전 답은 가드 기준을 통과하지 못했습니다. 위 규칙을 지키고 다시 작성하세요.\n
chat.ai.prompt.rag.retry.meaning.header=\n\n## PERSON_MEANING_RETRY\n
chat.ai.prompt.rag.retry.meaning.rejected=직전 답은 내 기록 태그/맥락을 인용하지 않아 거부되었습니다. 다시 작성하세요.\n
chat.ai.prompt.rag.retry.meaning.cite-required=반드시 아래 원문 태그명, 연결 맥락 태그 핵심어, 책터 분류, 기록 유형 중 하나 이상을 문장 안에 인용하세요.\n
chat.ai.prompt.rag.retry.meaning.no-generic-bucket=기존 빈 주제(업무 협업, 조직 관계 등) 전용 문구만 쓰지 마세요.\n
chat.ai.prompt.rag.retry.stance.header=\n\n## PERSON_STANCE_RETRY\n
chat.ai.prompt.rag.retry.stance.weak-evidence=직전 답이 기록 근거가 약하거나 빈 일반론이었습니다. 아래 SNAPSHOT 근거를 더 읽고 다시 쓰세요.\n
chat.ai.prompt.rag.retry.stance.honest-summary=네가 그 인물을 실제로 어떻게 느끼고 판단하는지 '네가', '내 태도', '내 마음' 중심으로 자연스러운 산문으로 솔직하게 정리하세요.\n
chat.ai.prompt.rag.retry.stance.opening-format=첫 문장은 '네가 기록에 남긴 바로는'로 시작하세요. 형식은 자유이며 근거 장면의 구체적 정황을 충분히 인용하세요.\n
chat.ai.prompt.rag.retry.stance.no-fabrication=기록에 없는 직업·관계·지위·사실은 단정하지 말고, 기록 근거 없는 조직·업무 일반론만 나열하지 마세요.\n
