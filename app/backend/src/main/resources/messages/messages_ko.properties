chat.ai.fallback.person-meaning.repeated-axis-interpret=해석: 위 태그는 내가 의도적으로 붙인 {0} 관련 축이야. 같은 장면의 다른 태그보다 이 축을 우선 보면 돼.
chat.ai.fallback.person-meaning.repeated-axis-empty=반복 축: {0} 이름이 들어간 person 태그가 아직 없어. 아래 근거 장면 중심으로만 보면 돼.
