# chat AI (server rule-primary / guard)
chat.ai.guard.response-rules=\n\n## \uC751\uB2F5 \uADDC\uCE59\n\uBC18\uB4DC\uC2DC \uD55C\uAD6D\uC5B4\uB85C\uB9CC \uB2F5\uBCC0\uD55C\uB2E4. \uC0AC\uC6A9\uC790\uAC00 \uBA85\uC2DC\uC801\uC73C\uB85C \uC694\uCCAD\uD558\uC9C0 \uC54A\uB294 \uD55C \uC911\uAD6D\uC5B4, \uC601\uC5B4, \uC77C\uBCF8\uC5B4 \uBB38\uC7A5\uC744 \uC11E\uC9C0 \uC54A\uB294\uB2E4.\n\uC0AC\uC6A9\uC790\uC758 \uC9C8\uBB38\uC774 \uD55C\uAD6D\uC5B4\uC774\uBA74 \uC790\uC5F0\uC2A4\uB7EC\uC6B4 \uD55C\uAD6D\uC5B4 \uAD6C\uC5B4\uCCB4\uB85C \uB2F5\uD55C\uB2E4.\n\uCC38\uACE0\uD560 \uC800\uB110 \uAE30\uB85D\uC740 \uAD00\uB828\uC131\uC774 \uCDA9\uBD84\uD560 \uB54C\uB9CC \uC0AC\uC6A9\uD55C\uB2E4. \uAD00\uB828\uC774 \uC57D\uD558\uBA74 \uC5B5\uC9C0\uB85C \uC5F0\uACB0\uD558\uC9C0 \uC54A\uB294\uB2E4.\n\uC0AC\uC6A9\uC790\uAC00 \uC778\uBB3C, \uC7A5\uC18C, \uD0DC\uADF8, \uACE0\uC720\uBA85\uC0AC\uB97C \uBB3C\uC73C\uBA74 \uC678\uBD80 \uC0C1\uC2DD\uBCF4\uB2E4 \uBA3C\uC800 \uCC38\uACE0 \uC800\uB110 \uAE30\uB85D \uC548\uC758 \uB9E5\uB77D\uC73C\uB85C \uC774\uD574\uD55C\uB2E4.\n\uC778\uBB3C\uC758 \uC9C1\uC5C5, \uC5ED\uD560, \uAD00\uACC4 \uC9C0\uC704\uB294 \uCC38\uACE0 \uAE30\uB85D\uC5D0 \uC9C1\uC811 \uB4DC\uB7EC\uB09C \uD45C\uD604\uC774 \uC788\uC744 \uB54C\uB9CC \uB9D0\uD55C\uB2E4. \uADFC\uAC70\uAC00 \uC5C6\uC73C\uBA74 \uCD94\uC815\uD558\uC9C0 \uB9D0\uACE0 \uD655\uC778\uB418\uC9C0 \uC54A\uB294\uB2E4\uACE0 \uBC1D\uD78C\uB2E4.\n\uC778\uBB3C/\uC0C1\uC9D5\uC758 \uC758\uBBF8\uB97C \uBB3B\uB294 \uC9C8\uBB38\uC5D0\uB294 \uCD5C\uC18C\uD55C \uB4F1\uC7A5 \uC7A5\uBA74, \uBC18\uBCF5\uB418\uB294 \uAD00\uACC4 \uCD95, \uC815\uC11C\uC801 \uAE30\uB2A5, \uD655\uC2E4\uD558\uC9C0 \uC54A\uC740 \uC810\uC744 \uAD6C\uBD84\uD574 \uB2F5\uD55C\uB2E4.\n\uAE30\uB85D\uC5D0\uC11C \uD655\uC778\uB418\uC9C0 \uC54A\uB294 \uC0AC\uB78C, \uC0AC\uAC74, \uC0AC\uC2E4\uC740 \uC544\uB294 \uCC99\uD558\uC9C0 \uB9D0\uACE0 \uD655\uC778\uB418\uB294 \uC815\uBCF4\uAC00 \uC5C6\uB2E4\uACE0 \uB9D0\uD55C \uB4A4 \uD544\uC694\uD55C \uB9E5\uB77D\uC744 \uC9E7\uAC8C \uBB3C\uC5B4\uBCF8\uB2E4.\n\uCC38\uACE0 \uAE30\uB85D\uACFC \uC9C8\uBB38\uC774 \uB9DE\uC9C0 \uC54A\uB354\uB77C\uB3C4 '\uC774\uC804 \uAE30\uB85D\uACFC \uBB34\uAD00\uD569\uB2C8\uB2E4' \uAC19\uC740 \uC2DC\uC2A4\uD15C \uB0B4\uBD80 \uD310\uB2E8\uC744 \uAE38\uAC8C \uC124\uBA85\uD558\uC9C0 \uC54A\uB294\uB2E4.
chat.ai.guard.language-retry=\n\n## \uC911\uC694\n\uC9C1\uC804 \uC751\uB2F5\uC5D0\uB294 \uD5C8\uC6A9\uB418\uC9C0 \uC54A\uB294 \uC911\uAD6D\uC5B4/\uD55C\uC790 \uBB38\uC7A5\uC774 \uC11E\uC600\uC2B5\uB2C8\uB2E4.\n\uC774\uBC88 \uC751\uB2F5\uC740 \uBC18\uB4DC\uC2DC \uD55C\uAE00 \uC911\uC2EC\uC758 \uD55C\uAD6D\uC5B4 \uBB38\uC7A5\uC73C\uB85C\uB9CC \uB2E4\uC2DC \uC791\uC131\uD558\uC138\uC694.\n\uC911\uAD6D\uC5B4 \uC6D0\uBB38, \uD55C\uC790 \uC774\uB984 \uCD94\uC815, \uBCD1\uC74C, \uBC88\uCCB4/\uAC04\uCCB4 \uBB38\uC790\uB97C \uC4F0\uC9C0 \uB9C8\uC138\uC694.
chat.ai.clarify.need-context=\uC9C0\uAE08 \uD655\uC778\uB418\uB294 \uAE30\uB85D\uB9CC\uC73C\uB85C\uB294 \uB2F5\uD558\uAE30 \uC5B4\uB824\uC6CC\uC694. \uC5B4\uB5A4 \uC0AC\uB78C\uC774\uB098 \uB9E5\uB77D\uC744 \uB9D0\uD558\uB294 \uAC74\uC9C0 \uC870\uAE08\uB9CC \uB354 \uC54C\uB824\uC918.
chat.ai.clarify.no-info-for-target=\uC9C0\uAE08 \uAE30\uB85D \uC548\uC5D0\uC11C\uB294 {0}\uC5D0 \uB300\uD574 \uD655\uC778\uB418\uB294 \uC815\uBCF4\uAC00 \uC5C6\uC5B4\uC694. \uC5B4\uB5A4 \uB9E5\uB77D\uC758 \uAE30\uB85D\uC744 \uBD10\uC57C \uD560\uC9C0 \uC870\uAE08\uB9CC \uB354 \uC54C\uB824\uC918.
chat.ai.clarify.no-appearance-for-target=\uC9C0\uAE08 \uAE30\uB85D \uC548\uC5D0\uC11C\uB294 {0}\uC774(\uAC00) \uC5B4\uB5A4 \uB290\uB08C\uC73C\uB85C \uB4F1\uC7A5\uD558\uB294\uC9C0 \uD655\uC778\uD560 \uC7A5\uBA74\uC744 \uCC3E\uC9C0 \uBABB\uD588\uC5B4\uC694.
chat.ai.clarify.no-stance-for-target=\uC9C0\uAE08 \uAE30\uB85D \uC548\uC5D0\uC11C\uB294 {0}\uC5D0 \uB300\uD574 \uB0B4 \uB9C8\uC74C\uC774 \uB4DC\uB7EC\uB09C \uC7A5\uBA74\uC744 \uCC3E\uC9C0 \uBABB\uD588\uC5B4\uC694. \uC5B4\uB5A4 \uB9E5\uB77D\uC758 \uAE30\uB85D\uC744 \uBD10\uC57C \uD560\uC9C0 \uC870\uAE08\uB9CC \uB354 \uC54C\uB824\uC918.
chat.ai.language-fallback.no-context=\uC9C0\uAE08 \uD655\uC778\uB418\uB294 \uAE30\uB85D\uB9CC\uC73C\uB85C\uB294 \uB2F5\uD558\uAE30 \uC5B4\uB824\uC6CC\uC694. \uC5B4\uB5A4 \uC0AC\uB78C\uC774\uB098 \uB9E5\uB77D\uC744 \uB9D0\uD558\uB294 \uAC74\uC9C0 \uC870\uAE08\uB9CC \uB354 \uC54C\uB824\uC918.
chat.ai.language-fallback.synthesis-retry=\uAD00\uB828 \uAE30\uB85D\uC740 \uCC3E\uC558\uC9C0\uB9CC, \uC751\uB2F5 \uC0DD\uC131 \uC911 \uC5B8\uC5B4\uAC00 \uC11E\uC5EC\uC11C \uADF8\uB300\uB85C \uBCF4\uC5EC\uC8FC\uC9C0 \uC54A\uC558\uC5B4\uC694. \uD1B5\uC12D \uB2F5\uBCC0\uC73C\uB85C \uB2E4\uC2DC \uC815\uB9AC\uD560 \uC218 \uC788\uAC8C \uC9C8\uBB38\uC744 \uD55C \uBC88\uB9CC \uB354 \uBCF4\uB0B4\uC918.
