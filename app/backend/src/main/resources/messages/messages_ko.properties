chat.ai.fallback.linked-context.empty=연결 태그·책터 분류 근거가 아직 충분하지 않아. 근거 장면 중심으로만 보면 돼.
chat.ai.fallback.linked-context.prefix=같은 장면의 연결 태그·책터 분류를 보면,
chat.ai.fallback.linked-context.suffix-scaffold= 기준
