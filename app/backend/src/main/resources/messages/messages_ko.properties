chat.ai.prompt.rag.tag-only-empty=해당 인물 태그가 붙은 저널 기록이 없습니다. 본문에 이름만 등장한 기록은 person-meaning 해석 재료로 사용하지 않습니다.
chat.ai.prompt.rag.journal-block=\n\n## 참고할 저널 기록\n아래는 현재 질문과 관련성이 충분하다고 검색된 나의 저널 기록입니다.\n질문 속 인물/키워드가 아래 기록에 등장하면, 외부 인물이 아니라 나의 Dreamdiary 기록 속 맥락으로 해석하세요.\n
chat.ai.prompt.rag.synthesis.stance-intro=아래 기록은 네가 이 인물에 대해 적어 둔 정서·패턴 재료입니다. 사건 줄거리가 아니라 반복 축·연결 맥락·기록 유형으로 내 태도를 통합해 비춰 주세요.
chat.ai.prompt.rag.synthesis.general-intro=아래 기록 묶음은 통섭을 위한 재료입니다. 단일 기록만 보지 말고 반복, 변화, 연결을 함께 보세요.
chat.ai.prompt.intent-classify=당신은 Dreamdiary 채팅의 RAG 검색 의도 분류기입니다.\n사용자 질문을 보고 다음 중 하나만 출력하세요: LOOKUP, SUMMARY, SYNTHESIS\nLOOKUP=구체 기록/태그/인물 찾기. SUMMARY=여러 기록 요약·정리. SYNTHESIS=패턴·의미·태도·통섭 해석.\n설명 없이 레이블 한 단어만 쓰세요.
chat.ai.prompt.intent.default=답변은 기록에 적힌 범위 안에서만 정리하고, 부족한 부분은 짧게 확인 질문을 덧붙이세요.
chat.ai.prompt.intent.summary=이 질문은 요약형 질문입니다. 기록 묶음에서 핵심 사건, 반복 주제, 눈에 띄는 변화를 간결하게 정리하세요.
chat.ai.prompt.intent.stance=이 질문은 내가 특정 인물을 어떻게 느끼고/생각하는지 묻는 태도·자기인식 질문입니다.\n첫 문장은 '네가 기록에 남긴 바로는'으로 시작하고, 답은 2인칭(네가·내 태도·내 마음)으로 기록에 드러난 나의 정서·거리감·반복 패턴을 비춰 주세요.\n형식은 자유입니다. 번호 매긴 섹션을 억지로 만들지 말고 자연스러운 산문으로 엮으세요.\n기록에 실제로 드러난 것만 근거로 삼으세요. 기록에 없는 직업·관계·지위·사실은 단정하지 말고, 확실치 않으면 '기록만으로는 확실치 않다'고 밝히세요.\n아래 기록에 이 인물에 대한 내 정서·태도 단서가 없으면 없다고 솔직하게 말하고, 어떤 맥락의 기록을 봐야 할지 짧게 확인 질문을 덧붙이세요.\n[1], [2] 같은 기록 번호 대신 날짜나 장면 표현으로 인용하세요.
chat.ai.prompt.intent.appearance-meaning=이 질문은 내 대화/기록 속 인물이 어떤 느낌·톤·역할로 등장하는지 묻는 통섭형 질문입니다.\n다음 항목 순서로 답하세요: 반복 축, 역할/기능, 기록 유형, 근거 장면, 확정 불가.\n등장 방식·느낌 = 인용 나열·대사 모음이 아니라 반복 축·연결 맥락·역할 축·기록 유형을 연결한 해석입니다.\n금지: 성격 단정(친근하다·자연스럽다 등), '추론하자면' 식 일반화, 태그 문자열 원문 나열, [엔서클] 같은 메타 접두.\n기록에 직접 나온 태그 축·역할·장면 단어만 근거로 삼고, 근거 없는 외부 인물 이미지로 빈칸을 채우지 마세요.\n단정하지 말고 '기록상으로는', '반복해서 보이는 건'처럼 근거의 한계를 드러내세요.
chat.ai.prompt.intent.synthesis=이 질문은 통섭형 질문입니다.\n금지: '업무 협업', '조직 관계', '사내 문화', '전략적 고민'처럼 태그·기록 인용 없는 빈 주제 분류.\n의미는 등장 장면 나열이 아니라 반복 축·역할·기능·기록 유형 차이를 연결한 해석입니다.\n내부 필드명(role_axes_ko, repeated_tags 등)이나 섹션 키를 답변 문장에 그대로 쓰지 마세요.\n답변은 기록에 확인되는 범위 안에서 다음 관점으로 엮으세요: 반복 축, 역할/기능, 기록 유형 차이, 근거 장면, 확정 불가.\n특히 인물의 의미를 묻는 경우, 그 사람이 실제 직장 상사/동료/연인/가족인지 같은 현실 관계 지위는 기록에 직접 나온 표현이 있을 때만 말하세요.\n기록에 직접 나온 장면 단어와 태그 축을 근거로 삼고, 근거 없는 일반론이나 외부 인물 이미지로 빈칸을 채우지 마세요.\n단정하지 말고 '기록상으로는', '반복해서 보이는 건'처럼 근거의 한계를 드러내세요.\n기록 조각을 단순 나열하지 말고, 사용자가 자기 흐름을 이해할 수 있게 하나의 해석으로 정리하세요.
chat.ai.prompt.intent.lookup-person=이 질문은 내 기록 속 특정 인물에 대한 질문입니다.\n인물의 직장·조직·관계 지위는 기록에 직접 나온 표현이 있을 때만 말하세요. 근거 없는 일반론(조직 내 중요 인물, 업무 협업 등)은 쓰지 마세요.\n[1], [2] 같은 기록 번호 대신 날짜나 장면 표현으로 인용하세요.\n기록에 적힌 범위 안에서만 정리하고, 부족하면 짧게 확인 질문을 덧붙이세요.
chat.ai.prompt.rag.tag-summary.header=## 태그 요약\n
chat.ai.prompt.rag.tag-summary.person-focus-intro=아래 태그는 {0} 관련 기록에서만 집계한 person 축 태그입니다.\n
chat.ai.prompt.rag.tag-summary.guide=태그는 사용자가 의도적으로 붙인 주제 축입니다. 본문보다 강한 해석 신호로 우선 참고하세요.\n
chat.ai.prompt.rag.tag-summary.label.total=전체 반복 태그
chat.ai.prompt.rag.tag-summary.label.dream=꿈 기록 태그
chat.ai.prompt.rag.tag-summary.label.diary=일기 기록 태그
chat.ai.prompt.rag.tag-summary.label.note=노트 기록 태그
chat.ai.prompt.rag.tag-summary.label.pair=연결 태그
chat.ai.prompt.rag.timeline.header=## 시간/유형 흐름\n
chat.ai.prompt.rag.timeline.period=기간: {0} ~ {1}\n
chat.ai.prompt.rag.timeline.label.content-kind=기록 유형
chat.ai.prompt.rag.timeline.label.month-density=월별 밀도
chat.ai.prompt.rag.timeline.guide=시간축은 주제가 어느 시기에 응집되거나 옮겨가는지 보는 보조 해석 축입니다.\n\n
chat.ai.prompt.rag.hybrid.header=\n\n## PERSON_SYNTHESIS_HYBRID\n
chat.ai.prompt.rag.hybrid.rule.snapshot-only=아래 SNAPSHOT만 근거로 답하세요. 스냅샷에 없는 성격·조직 역할·사건은 추측하지 마세요.\n
chat.ai.prompt.rag.hybrid.rule.no-internal-fields=내부 필드명(role_axes_ko, repeated_tags 등)이나 [1] 같은 인덱스 인용은 금지입니다.\n
chat.ai.prompt.rag.hybrid.rule.tag-hash-only=태그는 SNAPSHOT에 나온 #형태만 인용하세요.\n
chat.ai.prompt.rag.hybrid.rule.context-followup=최근 대화 맥락이 함께 오면 follow-up 보조용으로만 참고하고, SNAPSHOT 밖 사실은 쓰지 마세요.\n
chat.ai.prompt.rag.hybrid.stance.opening=질문은 사용자 자신의 태도입니다. 첫 문장은 '네가 기록에 남긴 바로는'으로 시작하세요.\n
chat.ai.prompt.rag.hybrid.stance.evidence=SNAPSHOT의 근거 장면을 최대한 많이 읽고, 네가 그 인물을 실제로 어떻게 느끼고 판단하는지 '네가', '내 태도', '내 마음' 중심으로 솔직하게 정리하세요.\n
chat.ai.prompt.rag.hybrid.stance.format-free=형식은 자유입니다. 번호 매긴 섹션을 억지로 만들지 말고, 기록에서 반복되는 결·긴장·감정 흐름을 자연스러운 산문으로 엮으세요.\n
chat.ai.prompt.rag.hybrid.stance.ground-only=기록에 실제로 드러난 것만 근거로 삼으세요. 기록에 없는 직업·관계·지위·사실은 단정하지 말고, 확실치 않으면 '기록만으로는 확실치 않다'고 밝히세요.\n
chat.ai.prompt.rag.hybrid.stance.continue-interpretation=네 기록에 이미 네 해석·메모가 있으면 무시하지 말고 이어받아 정리하세요.\n
chat.ai.prompt.rag.hybrid.stance.length=길이를 아끼지 말고, 근거 장면에서 드러난 구체적 정황을 충분히 인용하며 깊게 쓰세요.\n
chat.ai.prompt.rag.hybrid.appearance.question=질문은 내 대화/기록 속 인물의 등장 방식입니다.\n
chat.ai.prompt.rag.hybrid.appearance.format=답변 형식: (1) 등장 느낌·톤 (2) 반복 맥락 (3) 함께 묶인 축 (4) 확정 불가 — 네 섹션.\n
chat.ai.prompt.rag.hybrid.appearance.forbidden=금지: 인용 나열, 친근하다·적극적이다 같은 성격 단정, 추론하자면 일반화.\n
chat.ai.prompt.rag.hybrid.meaning.question=질문은 기록 속 인물/상징의 의미 통섭입니다.\n
chat.ai.prompt.rag.hybrid.meaning.guide=등장 맥락, 반복 축, 정서적 기능, 확정 불가를 구분해 짧게 답하세요.\n
