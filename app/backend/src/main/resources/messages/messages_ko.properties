chat.ai.fallback.person-appearance.uncertainty=(4) 확정 불가: 성격 단정(친근하다·적극적이다 등)이나 조직 내 지위는 기록에 직접 적힌 표현이 없으면 알 수 없어.
chat.ai.fallback.person-stance.intro-no-lead=네가 기록에 남긴 바로는, {0}에 대한 내 태도가 아직 한 줄로 뚜렷하게 잡히진 않아.
chat.ai.fallback.person-stance.caveat= 다만 상대의 성격이나 조직에서의 역할처럼 기록에 직접 안 적힌 건 단정하기 어려워.
chat.ai.fallback.person-stance.evidence-intro=\n\n이런 장면들이 그렇게 느끼게 했어: 
