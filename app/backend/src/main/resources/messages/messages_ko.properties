chat.ai.guard.response-rules=\n\n## 응답 규칙\n반드시 한국어로만 답변한다. 사용자가 명시적으로 요청하지 않는 한 중국어, 영어, 일본어 문장을 섞지 않는다.\n사용자의 질문이 한국어이면 자연스러운 한국어 구어체로 답한다.\n참고할 저널 기록은 관련성이 충분할 때만 사용한다. 관련이 약하면 억지로 연결하지 않는다.\n사용자가 인물, 장소, 태그, 고유명사를 물으면 외부 상식보다 먼저 참고 저널 기록 안의 맥락으로 이해한다.\n인물의 직업, 역할, 관계 지위는 참고 기록에 직접 드러난 표현이 있을 때만 말한다. 근거가 없으면 추정하지 말고 확인되지 않는다고 밝힌다.\n인물/상징의 의미를 묻는 질문에는 최소한 등장 장면, 반복되는 관계 축, 정서적 기능, 확실하지 않은 점을 구분해 답한다.\n기록에서 확인되지 않는 사람, 사건, 사실은 아는 척하지 말고 확인되는 정보가 없다고 말한 뒤 필요한 맥락을 짧게 물어본다.\n참고 기록과 질문이 맞지 않더라도 '이전 기록과 무관합니다' 같은 시스템 내부 판단을 길게 설명하지 않는다.
chat.ai.guard.language-retry=\n\n## 중요\n직전 응답에는 허용되지 않는 중국어/한자 문장이 섞였습니다.\n이번 응답은 반드시 한글 중심의 한국어 문장으로만 다시 작성하세요.\n중국어 원문, 한자 이름 추정, 병음, 번체/간체 문자를 쓰지 마세요.
chat.ai.clarify.need-context=지금 확인되는 기록만으로는 답하기 어려워요. 어떤 사람이나 맥락을 말하는 건지 조금만 더 알려줘.
chat.ai.clarify.no-info-for-target=지금 기록 안에서는 {0}에 대해 확인되는 정보가 없어요. 어떤 맥락의 기록을 봐야 할지 조금만 더 알려줘.
chat.ai.clarify.no-appearance-for-target=지금 기록 안에서는 {0}이(가) 어떤 느낌으로 등장하는지 확인할 장면을 찾지 못했어요.
chat.ai.clarify.no-stance-for-target=지금 기록 안에서는 {0}에 대해 내 마음이 드러난 장면을 찾지 못했어요. 어떤 맥락의 기록을 봐야 할지 조금만 더 알려줘.
chat.ai.language-fallback.no-context=지금 확인되는 기록만으로는 답하기 어려워요. 어떤 사람이나 맥락을 말하는 건지 조금만 더 알려줘.
chat.ai.language-fallback.synthesis-retry=관련 기록은 찾았지만, 응답 생성 중 언어가 섞여서 그대로 보여주지 않았어요. 통섭 답변으로 다시 정리할 수 있게 질문을 한 번만 더 보내줘.
chat.ai.language-fallback.lookup-retry=관련 기록은 일부 찾았지만, 응답 생성 중 언어가 섞여서 그대로 보여주지 않았어요. 질문을 조금 더 구체적으로 말해주면 한국어로 다시 정리해볼게.
chat.ai.lead.person-meaning=기록상 {0}은(는) {1}.
chat.ai.lead.person-stance=네가 기록에 남긴 태도로 보면, {0}.
chat.ai.hint.content-kind.dream=꿈 기록 쪽에서 더 자주 등장해
chat.ai.hint.content-kind.diary=일기 기록 쪽에서 더 자주 등장해
chat.ai.hint.content-kind.note=노트 기록 쪽에서 더 자주 등장해
chat.ai.hint.content-kind.dream-diary=꿈과 일기 기록에서 비슷하게 등장해
