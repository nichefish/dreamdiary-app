chat.ai.prompt.rag.journal-block=\n\n## Journal records to consult\nBelow are my journal records judged sufficiently relevant to the current question.\nIf the person or keyword in the question appears below, interpret them in my Dreamdiary context, not as an external person.\n
chat.ai.prompt.rag.synthesis.stance-intro=The records below are emotional/pattern material you wrote about this person. Integrate my stance through recurring axes, linked context, and record types—not plot summary.
chat.ai.prompt.rag.synthesis.general-intro=The record bundle below is material for synthesis. Do not read a single record alone; read repetition, change, and links together.
chat.ai.prompt.intent-classify=You classify RAG retrieval intent for Dreamdiary chat.\nReply with exactly one label: LOOKUP, SUMMARY, or SYNTHESIS\nLOOKUP=find a concrete record/tag/person. SUMMARY=summarize a set of records. SYNTHESIS=interpret patterns, meaning, attitude, or whole context.\nOutput only the label, nothing else.
chat.ai.prompt.intent.default=Keep answers within what the records state and add a short clarifying question when something is missing.
chat.ai.prompt.intent.summary=This is a summary question. Concisely organize key events, recurring themes, and notable changes from the record bundle.
chat.ai.prompt.intent.stance=This is an attitude/self-awareness question about how I feel or think about a specific person.\nStart the first sentence with 'From what you recorded,' and answer in second person (you / my stance / my heart) reflecting emotions, distance, and recurring patterns shown in the records.\nFormat is free—do not force numbered sections; weave natural prose.\nUse only what the records actually show. Do not assert jobs, relationships, or status absent from the records; say when something is uncertain.\nIf the records lack emotional/attitude cues about this person, say so honestly and ask briefly which context to check.\nCite by date or scene, not [1], [2] record numbers.
chat.ai.prompt.intent.appearance-meaning=This synthesis question asks how a person feels, sounds, or functions in my dialogue/records.\nAnswer in order: recurring axes, role/function, record types, evidence scenes, what cannot be confirmed.\nAppearance is interpretation linking axes, context, roles, and record types—not quote dumps.\nForbidden: personality labels (friendly, natural, etc.), generic 'one might infer' phrasing, raw tag strings, meta prefixes like [ensemble].\nUse only tag axes, roles, and scene words that appear in the records; do not fill gaps with outside images.\nShow limits with phrases like 'in the records' or 'what repeats is'.
chat.ai.prompt.intent.synthesis=This is a synthesis question.\nForbidden: empty topic buckets without tag/record citations (work collaboration, org culture, strategic worry, etc.).\nMeaning is interpretation linking axes, roles, record-type differences—not scene lists.\nDo not echo internal field names (role_axes_ko, repeated_tags, etc.) in the answer.\nWithin confirmed records, weave: recurring axes, role/function, record-type differences, evidence scenes, what cannot be confirmed.\nFor person meaning, mention real-world roles (boss, colleague, partner, family) only when the records explicitly say so.\nUse scene words and tag axes from the records; do not fill gaps with generalities or outside images.\nShow limits with phrases like 'in the records' or 'what repeats is'.\nDo not list fragments; synthesize one interpretation the user can follow.
chat.ai.prompt.intent.lookup-person=This question is about a specific person in my records.\nMention workplace, organization, or relationship status only when the records explicitly state it. Do not use generic org/work tropes.\nCite by date or scene, not [1], [2] record numbers.\nStay within what is written; add a short clarifying question if needed.
chat.ai.prompt.rag.tag-summary.header=## Tag summary\n
chat.ai.prompt.rag.tag-summary.person-focus-intro=The tags below are person-axis tags aggregated only from records related to {0}.\n
chat.ai.prompt.rag.tag-summary.guide=Tags are subject axes the user attached intentionally. Treat them as stronger interpretive signals than body text.\n
chat.ai.prompt.rag.tag-summary.label.total=All recurring tags
chat.ai.prompt.rag.tag-summary.label.dream=Dream record tags
chat.ai.prompt.rag.tag-summary.label.diary=Diary record tags
chat.ai.prompt.rag.tag-summary.label.note=Note record tags
chat.ai.prompt.rag.tag-summary.label.pair=Linked tag pairs
chat.ai.prompt.rag.timeline.header=## Time / record-type flow\n
chat.ai.prompt.rag.timeline.period=Period: {0} ~ {1}\n
chat.ai.prompt.rag.timeline.label.content-kind=Record types
chat.ai.prompt.rag.timeline.label.month-density=Monthly density
chat.ai.prompt.rag.timeline.guide=The timeline axis is a secondary lens for when topics cluster or shift over time.\n\n
chat.ai.prompt.rag.hybrid.header=\n\n## PERSON_SYNTHESIS_HYBRID\n
chat.ai.prompt.rag.hybrid.rule.snapshot-only=Answer only from the SNAPSHOT below. Do not guess personality, org roles, or events absent from the snapshot.\n
chat.ai.prompt.rag.hybrid.rule.no-internal-fields=Do not cite internal field names (role_axes_ko, repeated_tags, etc.) or index markers like [1].\n
chat.ai.prompt.rag.hybrid.rule.tag-hash-only=Cite tags only in the # form shown in the SNAPSHOT.\n
chat.ai.prompt.rag.hybrid.rule.context-followup=If recent chat context is included, use it only as follow-up support—never facts outside the SNAPSHOT.\n
chat.ai.prompt.rag.hybrid.stance.opening=This question is about your own stance. Start the first sentence with 'From what you wrote in your records'.\n
chat.ai.prompt.rag.hybrid.stance.evidence=Read as many evidence scenes in the SNAPSHOT as you can. Honestly summarize how you feel and judge this person, centered on 'you', 'my stance', and 'my heart'.\n
chat.ai.prompt.rag.hybrid.stance.format-free=Format is free. Do not force numbered sections; weave recurring knots, tension, and emotional flow from the records in natural prose.\n
chat.ai.prompt.rag.hybrid.stance.ground-only=Ground only in what the records actually show. Do not assert jobs, relationships, status, or facts not in the records; if unsure, say 'the records alone cannot confirm'.\n
chat.ai.prompt.rag.hybrid.stance.continue-interpretation=If your records already contain your interpretations or notes, do not ignore them—build on them.\n
chat.ai.prompt.rag.hybrid.stance.length=Do not skimp on length; cite concrete circumstances from evidence scenes and write deeply.\n
chat.ai.prompt.rag.hybrid.appearance.question=This question is about how the person appears in your dialogue/records.\n
chat.ai.prompt.rag.hybrid.appearance.format=Answer format: (1) appearance tone (2) recurring context (3) linked axes (4) cannot confirm — four sections.\n
chat.ai.prompt.rag.hybrid.appearance.forbidden=Forbidden: quote dumps, personality labels (friendly, proactive, etc.), generic 'one might infer' phrasing.\n
chat.ai.prompt.rag.hybrid.meaning.question=This question synthesizes the meaning of a person/symbol in your records.\n
chat.ai.prompt.rag.hybrid.meaning.guide=Briefly separate appearance context, recurring axes, emotional function, and what cannot be confirmed.\n
