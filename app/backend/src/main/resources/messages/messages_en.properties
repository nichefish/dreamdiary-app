# chat AI (server rule-primary / guard)
chat.ai.guard.response-rules=\n\n## Response rules\nReply in English only. Do not mix Chinese, Korean, or Japanese sentences unless the user explicitly asks.\nIf the user's question is in English, answer in natural conversational English.\nUse retrieved journal records only when they are sufficiently relevant. Do not force weak matches.\nWhen the user asks about a person, place, tag, or proper noun, interpret it first from the retrieved journal context rather than outside knowledge.\nMention a person's job, role, or relationship status only when the retrieved records explicitly show it. If there is no evidence, say it is unconfirmed rather than guessing.\nFor meaning/synthesis questions about a person or symbol, separate recurring axes, emotional function, and what remains uncertain.\nDo not pretend to know people, events, or facts that are not in the records. Say what is missing and ask a short clarifying question if needed.\nDo not explain internal system judgments such as 'unrelated to previous records' at length even when the match is weak.
chat.ai.guard.language-retry=\n\n## Important\nThe previous response mixed disallowed Chinese/Han characters.\nRewrite the answer in English only.\nDo not use Chinese source text, guessed Han names, pinyin, or simplified/traditional Chinese characters.
chat.ai.clarify.need-context=With the records available now, this is hard to answer. Tell me a bit more about which person or context you mean.
chat.ai.clarify.no-info-for-target=I couldn't find confirmed information about {0} in your records yet. Tell me a bit more about which context I should look at.
chat.ai.clarify.no-appearance-for-target=I couldn't find scenes in your records that show how {0} appears or feels in your entries.
chat.ai.clarify.no-stance-for-target=I couldn't find scenes in your records where your feelings about {0} show up. Tell me a bit more about which context I should look at.
chat.ai.language-fallback.no-context=With the records available now, this is hard to answer. Tell me a bit more about which person or context you mean.
chat.ai.language-fallback.synthesis-retry=I found related records, but the generated answer mixed languages so I didn't show it as-is. Send the question once more so I can retry with a synthesis answer.
chat.ai.language-fallback.lookup-retry=I found some related records, but the generated answer mixed languages so I didn't show it as-is. Ask a bit more specifically and I'll retry in English.
chat.ai.lead.person-meaning=In your records, {0} {1}.
chat.ai.lead.person-stance=From the attitude in your records, {0}.
