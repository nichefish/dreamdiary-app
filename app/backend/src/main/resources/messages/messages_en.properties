chat.ai.prompt.rag.retry.hint.person-stance-too-short=The previous answer was too short. Read more evidence scenes and expand your stance and feelings at length.\n
chat.ai.prompt.rag.retry.hint.person-stance-scaffold-leak=The previous answer leaked internal field names or scaffold phrasing. Rewrite in natural prose without such meta expressions.\n
chat.ai.prompt.rag.retry.hint.person-stance-generic-bucket=The previous answer listed org/work generalities without record evidence. Cite actual tags and evidence scenes from the SNAPSHOT.\n
chat.ai.prompt.rag.retry.hint.person-meaning-hollow=The previous answer lacked record evidence or interpretation. Cite at least one of tags, linked context, chapters, or record types.\n
chat.ai.prompt.rag.retry.hint.language-guard=The previous answer violated the Korean-only rule. Write in Korean only.\n
chat.ai.prompt.rag.retry.hint.empty-response=The previous answer was empty. Rewrite using only the SNAPSHOT as evidence.\n
chat.ai.prompt.rag.retry.hint.default=The previous answer failed the guard checks. Follow the rules above and rewrite.\n
chat.ai.prompt.rag.retry.meaning.header=\n\n## PERSON_MEANING_RETRY\n
chat.ai.prompt.rag.retry.meaning.rejected=The previous answer was rejected because it did not cite your record tags/context. Rewrite.\n
chat.ai.prompt.rag.retry.meaning.cite-required=You must cite at least one of: raw tag names, linked-context keywords, chapter categories, or record types in your sentences.\n
chat.ai.prompt.rag.retry.meaning.no-generic-bucket=Do not use only empty-topic phrases (work collaboration, org relationships, etc.).\n
chat.ai.prompt.rag.retry.stance.header=\n\n## PERSON_STANCE_RETRY\n
chat.ai.prompt.rag.retry.stance.weak-evidence=The previous answer had weak evidence or empty generalities. Read the SNAPSHOT below more closely and rewrite.\n
chat.ai.prompt.rag.retry.stance.honest-summary=Honestly summarize how you feel and judge this person in natural prose, centered on 'you', 'my stance', and 'my heart'.\n
chat.ai.prompt.rag.retry.stance.opening-format=Start the first sentence with 'From what you wrote in your records'. Format is free; cite concrete circumstances from evidence scenes.\n
chat.ai.prompt.rag.retry.stance.no-fabrication=Do not assert jobs, relationships, status, or facts absent from the records; do not list org/work generalities without evidence.\n
