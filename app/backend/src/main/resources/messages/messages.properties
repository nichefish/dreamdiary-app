# Spring Boot MessageSourceAutoConfiguration 의 ResourceBundleCondition 은
# basename 에 해당하는 베이스 파일(locale suffix 없는 .properties)이 classpath 에
# 존재해야 조건을 통과하고 MessageSource 빈을 생성한다.
# 이 파일이 없으면 조건이 실패해 DelegatingMessageSource(빈 proxy)가 등록되고,
# MessageUtils.getMessage() 가 모든 키를 그대로 반환하게 된다.
# 실제 메시지는 messages_ko.properties / messages_en.properties 에 정의한다.
