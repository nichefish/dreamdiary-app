##
# application.yml
# 공용 설정 파일
##

# log4j2 프로필별 설정 로드
logging:
    config: classpath:config/log4j2/log4j2-${PROFILE}.yml

server:
    error:
        path: /error
        whitelabel:
            enabled: false
    servlet:
        context-path: /
        encoding:
            charset: UTF-8
            enabled: true
            force: true
        session:
            timeout: 1h

spring:
    application:
        name: dreamdiary

    web:
        resources:
            static-locations: file:/static/, classpath:/static/

    main:
        allow-bean-definition-overriding: true

    servlet:
        multipart:
            enabled: true
            location: ${FILE_UPLOAD_LOCATION}
            max-file-size: 500MB
            max-request-size: 500MB

    mvc:
        throw-exception-if-no-handler-found: true

    freemarker:
        suffix: .ftlh
        content-type: text/html; charset=utf-8
        request-context-attribute: rc
        expose-request-attributes: true
        expose-session-attributes: true
        cache: ${FREEMARKER_CACHE:true}

    mustache:
        check-template-location: false

    datasource:
        primary:
            driver-class-name: com.p6spy.engine.spy.P6SpyDriver
            jdbc-url: ${JDBC_P6SPY_URL}
            username: ${JDBC_USERNAME}
            password: ${JDBC_PASSWORD}

    jpa:
        show-sql: false      # Spring Boot에서 SQL 출력 여부 설정 (p6spy 사용 시 false)
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                format_sql: false   # SQL을 보기 좋게 포맷
                show_sql: false     # Hibernate에서 기본 SQL 출력 비활성화 (p6spy 사용)
                generate-ddl: true
                jdbc:
                    batch_size: 1000
                    batch_versioned_data: true
                    order_inserts: true
                    order_updates: true
                    time_zone: Asia/Seoul
                type:
                    descriptor:
                        sql: trace
                legacy_limit_handler: true
                default_batch_fetch_size: 1000
                enable_lazy_load_no_trans: true
        open-in-view: true
        defer-datasource-initialization: true # 중요

    flyway:
        url: ${JDBC_URL}
        user: ${JDBC_USERNAME}
        password: ${JDBC_PASSWORD}
        schemas: ${JDBC_SCHEMA}
        locations: classpath:schema/migration/{vendor}  # 현재 DB에 맞는 경로 자동 설정
        baseline-on-migrate: false  # 기존 스키마가 있어도 마이그레이션 실행
        validate-on-migrate: false  # 이전 SQL과 충돌 방지
        clean-disabled: true        # 혹시라도 clean이 허용되어 DB 리셋되는 것 방지
        enabled: false              # 자동 마이그레이션 off. (수동 처리)

    jackson:
        date-format: yyyy-MM-dd HH:mm:ss
        time-zone: Asia/Seoul
        serialization:
            fail-on-empty-beans: false

    messages:
        basename: messages/messages
        encoding: UTF-8
        use-code-as-default-message: false
        fallback-to-system-locale: false

    mail:
        default-encoding: UTF-8
        host: ${MAIL_HOST}
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        port: ${MAIL_PORT}
        protocol: ${MAIL_PROTOCOL}
        test-connection: false
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enabled: true
                        required: true
                    ssl:
                        trust: smtp.gmail.com

    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope:
                            - email
                            - profile
                        redirect-uri: "{baseUrl}/login/oauth2/code/google"
                        authorization-grant-type: authorization_code
                        client-name: Google
                    naver:
                        client-id: ${NAVER_CLIENT_ID}
                        client-secret: ${NAVER_CLIENT_SECRET}
                        scope:
                            - email
                        redirect-uri: "{baseUrl}/login/oauth2/code/naver"
                        authorization-grant-type: authorization_code
                        client-name: Naver
                provider:
                    google:
                        authorization-uri: https://accounts.google.com/o/oauth2/auth
                        token-uri: https://oauth2.googleapis.com/token
                        user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
                    naver:
                        authorization-uri: https://nid.naver.com/oauth2.0/authorize
                        token-uri: https://nid.naver.com/oauth2.0/token
                        user-info-uri: https://openapi.naver.com/v1/nid/me
                        user-name-attribute: response

    output:
        ansi:
            enabled: always

#OpenAPI Swagger config
springdoc:
    paths-to-match:
        - /api/**
    default-produces-media-type: application/json
    show-actuator: true
    cache:
        disabled: true

    swagger-ui:
        path: /api-docs.html
        disable-swagger-default-url: true
        display-request-duration: true
        operations-sorter: alpha
        tags-sorter: alpha

    api-docs:
        path: /api-docs
        #groups:
        #    enabled: true

# 서비스 진입 AOP (ServiceEntryLogAspect). 로컬에서 켜 두고 운영은 기본 false 권장.
app:
    auth:
        jwt:
            secret: ${JWT_SECRET}
            signup-token-ttl-seconds: 3600
        refresh-token:
            ttl-seconds: 1209600
        remember-me:
            key: ${REMEMBER_ME_KEY}
            param: ${REMEMBER_ME_PARAM}
            token-ttl-days: 30
        initial-admin-password: ${SYSTEM_INIT_TEMP_PW}

    journal:
        embedding:
            sync-on-startup: true
            worker:
                batch-size: 20
                fixed-delay-ms: 60000
                initial-delay-ms: 15000
        entity:
            worker:
                batch-size: 20
                fixed-delay-ms: 20000
                initial-delay-ms: 10000

    logging:
        service-entry:
            enabled: false
            log-finish: false

    file:
        allowed-extensions: jpg|jpeg|gif|png|bmp|webp|wav|mp3|mp4|txt|csv|tsv|json|xls|xlsx|doc|docx|ppt|pptx|hwp|pdf
        allowed-mime-types: image/jpeg|image/png|image/gif|image/bmp|image/webp|application/pdf|application/msword|application/vnd.ms-excel|application/vnd.openxmlformats-officedocument.wordprocessingml.document|application/vnd.openxmlformats-officedocument.spreadsheetml.sheet|application/vnd.openxmlformats-officedocument.presentationml.presentation|application/zip|application/x-rar-compressed|application/x-7z-compressed|text/plain|text/csv
        image-extensions: jpg|jpeg|png|gif|bmp|webp|svg

    #AES128 secret key; 16 chars
    crypto:
        aes128:
            secret-key: ${AES128_SECRET_KEY}

    integration:
        kasi:
            service-key: ${API_KASI_SERVICE_KEY}
            api-url: ${API_KASI_URL}

    release-history:
        max-list-size: 50

    ollama:
        base-url: http://localhost:11434
        chat-model: qwen2.5:7b
        embedding-model: nomic-embed-text
