##
# application-local.yml
# 로컬(local) 프로필용 설정 파일
##

# 로컬 포트 = 18081
server:
    domain: ${SERVER_DOMAIN:localhost}
    port: ${SERVER_PORT:18081}

spring:
    datasource:
        primary:
            driver-class-name: org.mariadb.jdbc.Driver
            jdbc-url: ${JDBC_URL}

    devtools:
        add-properties: true
        livereload:
            enabled: true
            port: 18089
        remote:
            restart:
                enabled: false
        restart:
            enabled: true

    jpa:
        database: mysql
        database-platform: org.hibernate.dialect.MariaDBDialect
        properties:
            hibernate:
                database: mysql
                dialect: org.hibernate.dialect.MariaDBDialect

    sql:
        init:
            # mode: always / embedded / never
            mode: never
            platform: mariadb
            continue-on-error: true

    redis:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD}

    elasticsearch:
        username: ${ELASTIC_USERNAME}
        password: ${ELASTIC_PASSWORD}
        uris: ${ELASTIC_URIS}

app:
    #jandi messenger properties
    integration:
        jandi:
            team-id: ${JANDI_TEAM_ID}
            topics:
                - name: NOTICE
                  id:  ${JANDI_TOPIC_NOTICE}
                - name: SCHEDULE
                  id: ${JANDI_TOPIC_SCHEDULE}
                - name: TEST
                  id: ${TEST}

    logging:
        service-entry:
            enabled: ${SERVICE_ENTRY_LOG_ENABLED:false}
            log-finish: ${SERVICE_ENTRY_LOG_FINISH:false}

    # 로컬 Ollama: 14B 시험 시 chat-model + chat-temperature(0.28) 권장. ollama pull 후 재기동.
    # num-predict: 태도 질문 풍부 신뢰(Option A) 답변이 잘리지 않도록 로컬에서 출력 상한을 키움(속도 희생 감수).
    ollama:
        chat-model: qwen2.5:14b
        chat-temperature: 0.28
        num-predict: 2048

# Actuator: 캐시 통계 계측용 노출 (local/dev 한정, prod 제외)
management:
    endpoints:
        web:
            exposure:
                include: health,info,caches,metrics
