##
# spy.properties
# p6spy 설정 파일
##

modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory
# SQL 로그는 Slf4J 로거 p6spy로 남긴다. 기본 statement는 INFO.
# JOURNAL_ENTRY_EMBEDDING_SYNC 실행 스레드만 statement를 DEBUG로 내린다.
appender=io.nicheblog.dreamdiary.infrastructure.log.p6spy.P6SpySlf4JLogger
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=P6SPY|%(currentTime)|%(executionTime)ms|%(category)|conn%(connectionId)|%(sqlSingleLine)

# PreparedStatement의 ? 를 실제 값으로 치환
logFormatted=true
logOriginalSql=false

# 모든 쿼리 로깅
executionThreshold=0
databaseDialectTimestampFormat=yyyy-MM-dd HH:mm:ss.SSS
databaseDialectBooleanFormat=true,false

# 부가 잡음은 제외하고 statement는 남김
excludecategories=resultset,debug,result,info,commit,rollback,batch
excludetables=flyway_schema_history
